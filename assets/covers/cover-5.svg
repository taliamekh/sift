<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0C5"/>
      <stop offset="60%" stop-color="#FFC890"/>
      <stop offset="100%" stop-color="#E69E68"/>
    </linearGradient>
  </defs>
  <rect width="500" height="700" fill="url(#bg5)"/>
  <!-- fridge -->
  <rect x="20" y="40" width="200" height="380" rx="14" fill="#F8F4ED"/>
  <rect x="30" y="50" width="180" height="360" rx="10" fill="#FBFAF5"/>
  <rect x="195" y="200" width="20" height="40" rx="4" fill="#E4DBC8"/>
  <!-- magnet letters -->
  <text x="60" y="120" font-family="Arial" font-size="34" font-weight="900" fill="#4B89C2">M</text>
  <text x="100" y="115" font-family="Arial" font-size="34" font-weight="900" fill="#E7724A">E</text>
  <text x="138" y="125" font-family="Arial" font-size="34" font-weight="900" fill="#E8B43E">U</text>
  <text x="58" y="170" font-family="Arial" font-size="34" font-weight="900" fill="#5BA37E">B</text>
  <text x="98" y="175" font-family="Arial" font-size="34" font-weight="900" fill="#C25490">O</text>
  <text x="140" y="170" font-family="Arial" font-size="34" font-weight="900" fill="#7E5BC2">N</text>
  <!-- counter -->
  <rect x="0" y="480" width="500" height="220" fill="#F0DCC0"/>
  <line x1="0" y1="480" x2="500" y2="480" stroke="#C9A887" stroke-width="2"/>
  <!-- mixing bowl -->
  <ellipse cx="200" cy="580" rx="100" ry="22" fill="#C03B36"/>
  <path d="M 100 580 C 100 540 300 540 300 580 L 290 660 C 290 690 110 690 110 660 Z" fill="#C03B36"/>
  <ellipse cx="200" cy="555" rx="90" ry="16" fill="#FBE6BE"/>
  <!-- whisk -->
  <line x1="320" y1="450" x2="340" y2="610" stroke="#B5B5B5" stroke-width="6" stroke-linecap="round"/>
  <path d="M 318 580 C 305 610 350 640 360 610 M 330 580 C 320 615 360 645 365 615 M 340 580 C 335 615 370 640 372 615" stroke="#9A9A9A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- mouse body -->
  <ellipse cx="290" cy="370" rx="85" ry="100" fill="#7FB8D9"/>
  <ellipse cx="290" cy="360" rx="60" ry="62" fill="#A8D2EA"/>
  <!-- ears -->
  <ellipse cx="245" cy="270" rx="22" ry="26" fill="#7FB8D9"/>
  <ellipse cx="245" cy="275" rx="14" ry="18" fill="#F4B0CD"/>
  <ellipse cx="335" cy="270" rx="22" ry="26" fill="#7FB8D9"/>
  <ellipse cx="335" cy="275" rx="14" ry="18" fill="#F4B0CD"/>
  <!-- eyes -->
  <circle cx="265" cy="350" r="13" fill="#FFF"/>
  <circle cx="315" cy="350" r="13" fill="#FFF"/>
  <circle cx="265" cy="352" r="6" fill="#1A1614"/>
  <circle cx="315" cy="352" r="6" fill="#1A1614"/>
  <circle cx="267" cy="349" r="2" fill="#FFF"/>
  <circle cx="317" cy="349" r="2" fill="#FFF"/>
  <!-- nose -->
  <ellipse cx="290" cy="395" rx="7" ry="5" fill="#1A1614"/>
  <line x1="290" y1="400" x2="290" y2="412" stroke="#1A1614" stroke-width="2"/>
  <!-- chef hat -->
  <ellipse cx="290" cy="220" rx="80" ry="40" fill="#FFFFFF"/>
  <ellipse cx="260" cy="200" rx="34" ry="28" fill="#FFFFFF"/>
  <ellipse cx="320" cy="200" rx="34" ry="28" fill="#FFFFFF"/>
  <ellipse cx="290" cy="175" rx="32" ry="26" fill="#FFFFFF"/>
  <rect x="240" y="248" width="100" height="22" fill="#EBE4D6"/>
</svg>
