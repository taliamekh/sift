<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4A56"/>
      <stop offset="100%" stop-color="#1E2A33"/>
    </linearGradient>
    <radialGradient id="flameG4" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="55%" stop-color="#FF8430"/>
      <stop offset="100%" stop-color="#5A1F0C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="700" fill="url(#bg4)"/>
  <!-- wall tile pattern -->
  <g opacity="0.18">
    <line x1="0" y1="60" x2="500" y2="60" stroke="#FFF" stroke-width="1"/>
    <line x1="0" y1="120" x2="500" y2="120" stroke="#FFF" stroke-width="1"/>
    <line x1="0" y1="180" x2="500" y2="180" stroke="#FFF" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="240" stroke="#FFF" stroke-width="1"/>
    <line x1="250" y1="0" x2="250" y2="240" stroke="#FFF" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="240" stroke="#FFF" stroke-width="1"/>
  </g>
  <!-- chef body -->
  <rect x="280" y="270" width="180" height="320" rx="20" fill="#FAFAF7"/>
  <rect x="290" y="280" width="40" height="280" fill="#EFEFEA" opacity="0.6"/>
  <!-- chef arm -->
  <rect x="160" y="370" width="170" height="40" rx="20" fill="#FAFAF7" transform="rotate(-12 245 390)"/>
  <!-- chef hat -->
  <ellipse cx="370" cy="200" rx="60" ry="48" fill="#FFFFFF"/>
  <ellipse cx="340" cy="180" rx="28" ry="24" fill="#FFFFFF"/>
  <ellipse cx="400" cy="180" rx="28" ry="24" fill="#FFFFFF"/>
  <ellipse cx="370" cy="155" rx="28" ry="24" fill="#FFFFFF"/>
  <rect x="320" y="240" width="100" height="26" fill="#EFE9DF"/>
  <!-- face -->
  <circle cx="370" cy="280" r="34" fill="#D9A66E"/>
  <ellipse cx="370" cy="310" rx="22" ry="6" fill="#3A2A1E"/>
  <circle cx="358" cy="275" r="2.5" fill="#1A1100"/>
  <circle cx="382" cy="275" r="2.5" fill="#1A1100"/>
  <!-- pan -->
  <ellipse cx="150" cy="430" rx="100" ry="22" fill="#1A1614"/>
  <ellipse cx="150" cy="423" rx="100" ry="20" fill="#0E0B0A"/>
  <rect x="240" y="416" width="80" height="14" rx="6" fill="#3A2A24" transform="rotate(-10 280 423)"/>
  <!-- flames -->
  <ellipse cx="140" cy="300" rx="190" ry="160" fill="url(#flameG4)"/>
  <path d="M 30 420 C 20 270 90 240 100 300 C 105 240 150 220 150 290 C 160 230 210 230 200 300 C 230 250 270 260 260 320 C 280 280 300 310 290 380 C 310 320 330 360 310 420 Z" fill="#FFA13B" opacity="0.92"/>
  <path d="M 70 410 C 80 320 120 300 115 340 C 130 290 180 290 170 340 C 195 290 230 290 220 350 C 240 310 250 350 230 410 Z" fill="#FFD96B" opacity="0.85"/>
  <path d="M 130 390 C 135 350 165 340 160 370 Z" fill="#FFF8DA"/>
</svg>
