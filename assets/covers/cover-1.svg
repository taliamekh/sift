<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE3E8"/>
      <stop offset="60%" stop-color="#F8C5D4"/>
      <stop offset="100%" stop-color="#EFA8C1"/>
    </linearGradient>
  </defs>
  <rect width="500" height="700" fill="url(#bg1)"/>
  <!-- counter line -->
  <rect x="0" y="420" width="500" height="280" fill="#F0D8DE"/>
  <!-- cutting board -->
  <rect x="60" y="380" width="380" height="180" rx="10" fill="#E0B68A"/>
  <rect x="60" y="378" width="380" height="6" fill="#C99970"/>
  <!-- dough rounds -->
  <ellipse cx="140" cy="370" rx="40" ry="28" fill="#FFFAF2"/>
  <ellipse cx="225" cy="370" rx="40" ry="28" fill="#FFFAF2"/>
  <ellipse cx="310" cy="370" rx="40" ry="28" fill="#FFFAF2"/>
  <ellipse cx="395" cy="370" rx="40" ry="28" fill="#FFFAF2"/>
  <!-- rolled dough -->
  <ellipse cx="280" cy="470" rx="120" ry="48" fill="#FFFCF6"/>
  <!-- rolling pin -->
  <rect x="160" y="455" width="240" height="22" rx="10" fill="#D2A877"/>
  <rect x="140" y="461" width="22" height="10" rx="2" fill="#A37D54"/>
  <rect x="398" y="461" width="22" height="10" rx="2" fill="#A37D54"/>
  <!-- cat silhouette -->
  <ellipse cx="380" cy="560" rx="100" ry="80" fill="#7C6850"/>
  <path d="M 320 510 L 305 460 L 340 490 Z" fill="#7C6850"/>
  <path d="M 420 500 L 435 450 L 450 490 Z" fill="#7C6850"/>
  <circle cx="350" cy="540" r="5" fill="#FFF8F1"/>
  <circle cx="395" cy="540" r="5" fill="#FFF8F1"/>
  <path d="M 360 565 Q 372 575 384 565" stroke="#FFF8F1" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- stripes -->
  <path d="M 330 530 Q 340 540 350 530 M 410 525 Q 420 535 430 525 M 320 580 Q 340 590 360 580 M 400 580 Q 420 590 440 580" stroke="#3B2E1F" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.45"/>
  <!-- flour dots -->
  <circle cx="100" cy="430" r="3" fill="#FFF" opacity="0.8"/>
  <circle cx="130" cy="450" r="2" fill="#FFF" opacity="0.6"/>
  <circle cx="180" cy="500" r="3" fill="#FFF" opacity="0.7"/>
  <circle cx="60" cy="450" r="2" fill="#FFF" opacity="0.5"/>
</svg>
